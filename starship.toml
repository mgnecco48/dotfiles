"$schema" = 'https://starship.rs/config-schema.json'


add_newline = false
command_timeout = 200
format = '$directory$git_branch$git_status$hostname$python$conda$character'

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold green)"

[hostname]
ssh_only = true
format = '[$hostname ](italic fg:#ff8700)'

[directory]
truncation_length = 3
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic purple"

[git_status]
format = '[$all_status$ahead_behind]($style)'
ahead = "[⇡${count}](fg:#00ff7f) "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = "[ ](fg:#00ff7f)"
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""

[python]
format = '[\(🔆 $virtualenv\)](italic yellow) '
detect_extensions = []
detect_files = []
detect_folders = []

[conda]
format = '[\(🐍 $environment\)](italic yellow) '
