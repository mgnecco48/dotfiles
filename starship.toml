"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 200
format = '$directory$git_branch$git_status([$username:$hostname](italic fg:#ffe4b5 bg:#333333))$python$character'

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold green)"

[username]
show_always = false
format = '[$user]($style)'
style_user = "italic cyan bg:#333333"
style_root = "bold red"

[hostname]
ssh_only = true
format = '[$hostname](italic fg:#ff8700 bg:#333333)'

[directory]
truncation_length = 3
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic purple"

[git_status]
format = '[$all_status]($style)'
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""

# Add this section to explicitly handle the virtualenv name
[python]
format = '[\(🌱 $virtualenv\)](italic yellow) '
detect_extensions = []
detect_files = []
detect_folders = []
